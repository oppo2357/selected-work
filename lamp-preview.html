document.addEventListener('change',event=>{const input=event.target;if(input.name==='light'){const img=document.getElementById('photo');img.src=photos[input.value];img.alt=input.value==='on'?'宵灯の点灯イメージ':'宵灯の消灯イメージ'}if(input.name==='bundle'){const cart=document.getElementById('cart');cart.disabled=input.value==='pair';cart.textContent=cart.disabled?'売り切れ':'デモカートに入れる';document.getElementById('notice').textContent='';const pair=input.value==='pair';document.getElementById('price').textContent=pair?'¥16,500（税込）':'¥8,800（税込）';document.getElementById('stock').textContent=pair?'売り切れ':'在庫あり'}});document.getElementById('cart').onclick=()=>{document.getElementById('notice').textContent='1灯をデモカートに追加しました。注文・決済は発生しません。'};</script></html>
