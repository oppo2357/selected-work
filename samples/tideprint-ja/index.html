<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ebeadc"><title>Tideprint — 港の試し刷り</title>
  <link rel="stylesheet" href="./press.css"><script src="./plates.js" defer></script><script src="./press.js" defer></script>
</head>
<body>
<header><div class="mast"><svg viewBox="0 0 40 32" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" d="M1 16q5-8 10 0t10 0t10 0t10 0M1 23q5-8 10 0t10 0t10 0t10 0"/><circle cx="21" cy="6" r="4" fill="currentColor"/></svg><span>Tideprint</span></div><span class="mastsub">港の試し刷り</span><button id="sound" aria-pressed="false">音：オフ</button></header>
<main>
  <section class="ref">
    <div class="kicker"><i></i> 見本</div><h1 id="title"></h1>
    <div class="reference-picture" id="reference" role="img"></div>
    <div class="caption"><span id="edition"></span><span>港の風景</span></div>
    <p id="effect"></p>
    <nav id="levels" aria-label="遊べる絵柄を選ぶ"></nav>
  </section>
  <section class="work"><div class="headrow"><h2>試し刷り</h2><span class="status" id="status">版ずれ</span></div>
    <div class="bed"><div id="print" role="img" aria-label="現在の版の位置で刷った絵"></div></div>
    <div class="counter"><span>手数 <strong id="moves">0</strong></span><span>最短 <strong id="par"></strong></span><span>自己ベスト <strong id="best">—</strong></span></div>
  </section>
  <section class="operate" aria-label="版の操作">
    <h2>版を動かす</h2><p>見本と同じ絵を刷りましょう。色を選び、矢印で版を1マスずつ動かします。端からはみ出した部分は反対側に現れます。</p>
    <div class="ink-pick"><button id="blue" data-ink="0" aria-pressed="false"><i></i>青緑</button><button id="red" data-ink="1" aria-pressed="false"><i></i>朱色</button></div>
    <div class="pad" aria-label="選んだ版をずらす">
      <button data-dir="up" aria-label="上へ">↑</button><button data-dir="left" aria-label="左へ">←</button><button data-dir="down" aria-label="下へ">↓</button><button data-dir="right" aria-label="右へ">→</button>
    </div>
    <div class="utility"><button id="undo" title="一手戻す (Z)">一手戻す</button><button id="reset" title="やり直す (R)">やり直す</button><button id="hint" title="最短手順の次の一手（H）">ヒント</button></div>
    <div class="result" aria-live="polite"><p id="feedback"></p><button id="advance" hidden>次の絵へ →</button></div>
    <small class="keys">矢印で移動 · 1 / 2 で色を選択<br>Z 一手戻す · R やり直す · H ヒント</small>
  </section>
</main>
<dialog id="finished"><form method="dialog"><div class="kicker"><i></i> 港の風景</div><h2>全作品、刷り上がり！</h2><p id="summary"></p><button>刷り台へ戻る</button></form></dialog>
</body>
</html>
