<h1>水栓モデルのGLB軽量化</h1>
<p>自主制作した水栓の金属面と操作表示を残し、三角形数を58%、ファイル容量を37%削減しました。</p>
<main>
<figure><a href="reference-glb-detail.png"><img src="reference-glb-detail.png" width="720" height="540" alt="元モデルの円筒面と温度・止水表示の接写"></a><figcaption><strong>元モデル</strong>　150,267三角形・4.63 MB</figcaption></figure>
<figure><a href="selective-detail.png"><img src="selective-detail.png" width="720" height="540" alt="同じ視点から見た軽量版の金属反射と操作表示"></a><figcaption><strong>軽量版</strong>　63,350三角形・2.94 MB</figcaption></figure>
</main>
<p>一律に削減すると円筒の反射に筋が出たため、水栓本体や握り部は元の形状を維持しました。両方のGLBをBlenderに読み戻し、同じカメラと照明で撮影しています。容量と三角形数は背景を除く製品全体の値です。</p>
