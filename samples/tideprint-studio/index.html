<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eae5d4"><title>Tideprint</title>
  <link rel="stylesheet" href="press.css"><script src="plates.js" defer></script><script src="press.js" defer></script>
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-wave" viewBox="0 0 40 32"><circle cx="21" cy="5" r="4" fill="currentColor" stroke="none"/><path d="M1 16q5-7 10 0t10 0t10 0t10 0M1 23q5-7 10 0t10 0t10 0t10 0"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6.5-6.5L19 12l-6.5 6.5"/></symbol>
    <symbol id="i-teal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="currentColor" stroke="none"/><path d="M8.5 12h7" stroke="#fff7dd"/></symbol>
    <symbol id="i-coral" viewBox="0 0 24 24"><path d="m12 3.6 9 16H3z" fill="currentColor" stroke="none"/><path d="M12 10.5v4" stroke="#fff7dd"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M10 5 4 10l6 5m-5-5h8c5 0 7 3 7 7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 10a7.5 7.5 0 1 1 .5 6m-.5-12v6h6"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M7 10a5 5 0 1 1 9 3c-1.6 1.8-2 2.3-2 4h-4c0-1.7-.4-2.3-2-4A5 5 0 0 1 7 10zM10 20h4M3 9H1m22 0h-2M4 3l2 2m14-2-2 2"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12 5 5 10-11"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
  </defs></svg>
  <div class="shell">
    <header>
      <h1><svg class="wave" viewBox="0 0 40 32" aria-hidden="true"><use href="#i-wave"/></svg>Tideprint</h1>
      <nav id="levels" aria-label="Choose a harbour print"></nav>
      <button id="sound" aria-label="Sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-speaker"/><path id="muted" d="m16 9 5 6m0-6-5 6"/><path id="audible" d="M16 8q4 4 0 8m3-11q6 7 0 14"/></svg></button>
    </header>
    <main>
      <aside class="proof" aria-label="Target print">
        <div class="proof-card"><div class="proof-top" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-target"/></svg><i></i></div><div id="reference" role="img"></div></div>
      </aside>
      <section class="press" aria-label="Working press">
        <div class="bed"><div id="print" role="img" aria-label="Working print. Swipe or use the arrow keys to shift the selected ink layer."></div><svg class="seal" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-check"/></svg></div>
      </section>
      <section class="tools" aria-label="Press controls">
        <div class="inks" role="group" aria-label="Select an ink plate">
          <button id="blue" aria-label="Select teal ink" aria-keyshortcuts="1"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-teal"/></svg></button>
          <button id="red" aria-label="Select coral ink" aria-keyshortcuts="2"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-coral"/></svg></button>
        </div>
        <div class="pad" role="group" aria-label="Shift selected plate">
          <button data-dir="up" aria-label="Shift up" aria-keyshortcuts="ArrowUp"></button><button data-dir="left" aria-label="Shift left" aria-keyshortcuts="ArrowLeft"></button><div class="pad-hub" aria-hidden="true"></div><button data-dir="right" aria-label="Shift right" aria-keyshortcuts="ArrowRight"></button><button data-dir="down" aria-label="Shift down" aria-keyshortcuts="ArrowDown"></button>
        </div>
        <div class="utility">
          <button id="undo" aria-label="Undo last move" aria-keyshortcuts="Z"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
          <button id="reset" aria-label="Restart this print" aria-keyshortcuts="R"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-reset"/></svg></button>
          <button id="hint" aria-label="Highlight the next move" aria-keyshortcuts="H"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-hint"/></svg></button>
        </div>
        <button id="advance" hidden aria-label="Next print"></button>
      </section>
    </main>
  </div>
  <div class="sr" id="voice" role="status" aria-live="polite"></div>
  <dialog id="finished" aria-label="Completed harbour print collection">
    <div class="album-head"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg><button id="close" aria-label="Close collection"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div id="gallery"></div>
  </dialog>
</body>
</html>
