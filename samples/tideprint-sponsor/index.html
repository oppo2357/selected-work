<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eae5d4"><title>Tideprint</title>
  <style>
*{box-sizing:border-box}
:root{--ink:#173b40;--teal:#186878;--coral:#d85939;--paper:#f7f0dc;--rule:#9eaa98;--key:clamp(43px,4.6vw,60px);--bed:min(43vw,calc(100svh - 132px),610px);color:var(--ink);background:#eae6d6;color-scheme:light}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 42%,#f6f1e2,#eae6d6 70%);font-family:"Inter","Segoe UI",sans-serif}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.shell{width:min(1520px,100%);margin:0 auto;padding:0 clamp(15px,4vw,64px)}
header{height:clamp(65px,10svh,94px);display:grid;align-items:center;grid-template-columns:1fr auto 1fr;gap:12px;border-bottom:1px solid #969f8e}
h1{display:flex;align-items:center;gap:.24em;margin:0;font:700 clamp(34px,4.4vw,65px)/.88 Georgia,"Times New Roman",serif;letter-spacing:-.085em}
.wave{width:.57em;height:.56em;stroke-width:2.6}
button,.proof-card,.bed{color:var(--ink)}
button{appearance:none;cursor:pointer;background:transparent;border:0;padding:0;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}button:focus-visible{outline:3px solid #a13d23;outline-offset:2px}button:not(:disabled):active{transform:translateY(1px)}
svg{display:block}button svg,.wave,.proof-top svg,.album-head>svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button svg,.album-head>svg{width:24px;height:24px;pointer-events:none}
#levels{display:flex;align-items:center;justify-content:center}
#levels button{width:clamp(30px,3.1vw,44px);height:42px;position:relative}
#levels button::before{content:"";width:10px;height:10px;border:1.5px solid #838f80;border-radius:50%}
#levels button[aria-current=step]::before{border:3px solid var(--ink);width:14px;height:14px}
#levels button[data-complete]::before{border-color:var(--ink);background:var(--ink)}
#levels button[aria-current=step][data-complete]::before{box-shadow:inset 0 0 0 2px var(--paper)}
#sound{width:44px;height:44px;justify-self:end}#sound[aria-pressed=false] #audible,#sound[aria-pressed=true] #muted{display:none}
main{display:grid;grid-template-areas:"proof press tools";grid-template-columns:minmax(0,.65fr) var(--bed) minmax(0,.68fr);align-items:center;justify-content:center;gap:clamp(20px,3.7vw,70px);min-height:calc(100svh - clamp(65px,10svh,94px));padding:18px 0 35px}
.proof{grid-area:proof;justify-self:end;width:min(100%,calc(var(--bed)*.55));position:relative}
.proof-card{background:var(--paper);border:1px solid #a2a58e;box-shadow:3px 4px 0 #c4c2aa;transform:rotate(-3deg);position:relative}
.proof-card::before{content:"";position:absolute;width:24%;height:8px;top:-4px;left:38%;background:#1b4147;z-index:1}
.proof-top{display:flex;align-items:center;gap:8px;margin:clamp(5px,1.3vw,14px) 8% -2%;color:var(--teal)}
.proof-top svg{width:clamp(15px,2.1vw,27px);height:auto}.proof-top i{width:100%;border-top:1px solid #98a994}
.press{grid-area:press}.bed{padding:clamp(8px,1.5vw,22px);background:var(--ink);border-radius:5px;box-shadow:0 5px 0 #a5a58d,0 13px 22px #243f3522;position:relative}
.bed::before,.bed::after{content:"";position:absolute;height:3px;width:12%;background:#afae8f;left:44%;border-radius:2px}.bed::before{top:3px}.bed::after{bottom:3px}
#reference svg,#print svg,#gallery button svg{width:100%;height:auto;aspect-ratio:1;display:block}
#print{touch-action:none;user-select:none;-webkit-user-select:none}
.seal{display:none;position:absolute;right:3.2%;bottom:3.2%;width:10%;height:auto;padding:1.3%;border:2px solid var(--paper);border-radius:50%;background:var(--teal);color:var(--paper);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;pointer-events:none}
.registered .seal{display:block}
.tools{grid-area:tools;justify-self:start;display:grid;justify-items:center;gap:clamp(12px,2.2svh,25px);position:relative;--tone:var(--coral)}
.inks,.utility{display:flex;justify-content:center;align-items:center}
.inks{gap:5px;padding:3px;border:1px solid #aab19e;border-radius:28px}
.inks button{width:calc(var(--key)*1.09);height:calc(var(--key)*.76);border-radius:20px}
#blue{color:var(--teal)}#red{color:var(--coral)}.inks button:disabled:not([aria-pressed=true]){opacity:.4;background:repeating-linear-gradient(135deg,transparent,transparent 5px,#b6bcab 5px,#b6bcab 6px)}
.inks button[aria-pressed=true]{background:#fff8e7;box-shadow:0 0 0 1.5px var(--ink)}.inks button svg{width:26px;height:26px}
.pad{display:grid;grid-template-columns:repeat(3,var(--key));grid-template-rows:repeat(3,var(--key));grid-template-areas:". up ." "left hub right" ". down .";gap:4px}
.pad button{width:100%;height:100%;border:1px solid #98a390;background:#f8f2e1;border-radius:10px;box-shadow:0 2px 0 #b1b49d}
[data-dir=up]{grid-area:up}[data-dir=left]{grid-area:left}[data-dir=right]{grid-area:right}[data-dir=down]{grid-area:down}
[data-dir=up] svg{transform:rotate(-90deg)}[data-dir=left] svg{transform:rotate(180deg)}[data-dir=down] svg{transform:rotate(90deg)}
.pad-hub{grid-area:hub;display:grid;place-items:center}.pad-hub svg{width:24px;height:24px;color:var(--tone);fill:none;stroke-width:1.8}
.utility{border-top:1px solid #a4ae9a;gap:3px;width:100%}.utility button{width:var(--key);height:calc(var(--key)*.83)}.utility button:disabled{opacity:.32}
.tools .guided{outline:2px dashed var(--tone);outline-offset:2px;background:#fff6d9}
.pad button.first-move{color:#fffaf0;background:#a44024;border:2px solid #81341e;outline:none}
.pad button.first-move:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media(prefers-reduced-motion:no-preference){
  .pad button.first-move{animation:invite-press 1.25s ease-out 2}
  @keyframes invite-press{from{box-shadow:0 0 0 0 #a4402460}to{box-shadow:0 0 0 8px #a4402400}}
}
#advance{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--key)*1.4);height:calc(var(--key)*1.4);border:4px solid var(--paper);border-radius:50%;background:var(--teal);color:#fff9e8;box-shadow:0 0 0 2px var(--teal)}
#advance:active{transform:translate(-50%,-49%)}#advance svg{width:50%;height:50%}#advance[hidden]{display:none}
.tools.done .inks,.tools.done .pad,.tools.done .utility{opacity:.28}
dialog{width:min(620px,90vw,calc(128svh));max-height:94svh;overflow:auto;padding:clamp(10px,2.8vw,30px);color:var(--ink);background:var(--paper);border:2px solid var(--ink);box-shadow:7px 8px 0 #173b4070}
dialog::backdrop{background:#122d31bb}.album-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);margin-bottom:12px}
.album-head>svg{color:var(--teal);width:28px;height:28px}.album-head button{width:40px;height:40px}
#gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#gallery button{border:1px solid var(--rule);width:100%}#gallery button svg{stroke:none;fill:#000;stroke-width:1}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(orientation:portrait){
  :root{--key:clamp(40px,11.8vw,58px);--bed:min(91vw,calc(100svh - 278px),560px)}
  header{height:clamp(49px,7.6svh,78px);grid-template-columns:1fr auto auto;gap:5px}
  .shell{padding:0 clamp(10px,4vw,48px)}h1{font-size:clamp(32px,7.1vw,55px)}#levels button{width:clamp(20px,4.6vw,35px);height:38px}#sound{width:35px}
  main{grid-template-areas:"press press" "proof tools";grid-template-columns:minmax(0,.85fr) minmax(0,1fr);justify-items:center;align-content:center;min-height:calc(100svh - clamp(49px,7.6svh,78px));gap:clamp(12px,2.5svh,27px) 12px;padding:8px 0 13px}
  .press{width:var(--bed)}.proof{width:min(100%,31vw,170px);justify-self:end;margin-right:8%}
  .tools{gap:5px;justify-self:center}.pad{gap:3px}.pad button{border-radius:8px}.inks{padding:2px}.inks button,.utility button{min-height:32px}.utility button svg{width:21px;height:21px}
}
@media(orientation:landscape) and (max-height:490px){
  :root{--bed:min(42vw,calc(100svh - 62px));--key:clamp(36px,12.6svh,49px)}
  .shell{padding:0 14px}header{height:37px;gap:5px}h1{font-size:28px}#sound,#levels button{height:34px}#levels button{width:30px}
  main{min-height:calc(100svh - 37px);gap:clamp(8px,2.5vw,28px);padding:8px 0 12px;grid-template-columns:minmax(0,.65fr) var(--bed) minmax(0,.72fr)}
  .tools{gap:4px}.inks{padding:2px}.inks button,.utility button{min-height:30px}.pad{gap:2px}.pad button{border-radius:6px}.pad button svg,.utility button svg{width:20px;height:20px}.bed{padding:8px}.proof{width:min(100%,calc(var(--bed)*.66))}
  .album-head{margin-bottom:4px}.album-head button{height:28px}#gallery{gap:4px}
}
@media (max-height:530px) and (orientation:portrait){:root{--key:32px;--bed:min(77vw,calc(100svh - 240px))}main{gap:9px}.proof{width:min(100%,29vw)}}
@media (max-width:360px) and (orientation:portrait){
  h1{font-size:27px}header{gap:3px}#levels button{width:17px}#sound{width:29px}
  :root{--bed:min(87vw,calc(100svh - 301px))}
  main{gap:10px 8px}
}

</style>

<body>

  <div class="shell">

    <div id="gallery"></div>

<script>
/* All six separations are drawn directly for this game. Coordinates are on a 100-unit plate. */
const fills = (...paths) => paths.map(d => '<path d="' + d + '"/>').join('');
const lines = (width, ...paths) => paths.map(d => '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="' + width + '" stroke-linecap="round" stroke-linejoin="round"/>').join('');
const disk = (x, y, r) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"/>';
const flock = (x, y, scale) => '<g transform="translate(' + x + ' ' + y + ') scale(' + scale + ')">' + lines(1.5, 'M0 3Q3 0 6 3Q9 0 12 3') + '</g>';
const waves = (x, y, count, length) => Array.from({length:count}, (_,i) => lines(1.25,'M'+(x+(i%2)*3)+' '+(y+i*3.3)+'q6 -2 12 0t12 0h'+length)).join('');
const cut = (d) => '<path fill-rule="evenodd" d="' + d + '"/>';

const editions = [
  {
    name:"Channel light", rule:"The teal plate is clamped. Shift the coral plate to put the lantern on its tower.",
    linked:[0,0,0,0], fixed:true, scramble:["1r","1u","1r"],

      disk(71,26,13)+fills("M43.6 46L54.6 42.5 55.7 49.4 42.5 53.5Z","M41 61L57.6 56 59 62 40.5 68Z","M43.5 27H54.5V32.5H43.5Z","M74 78L91 79.5 89 82H71Z")+lines(1.3,"M38 35H60","M16 78L30 78","M64 88H85")+flock(17,28,.55)
    ]
  },{
    name:"Trade winds",rule:"Both plates are free. Set the sails above the hull and bring the sun back to the horizon.",
    linked:[0,0,0,0],scramble:["0l","0u","1r","1d"],
    art:[

      disk(74,29,12)+fills("M51 18Q73 31 84 58L52 63Z","M30 58L46 41 45 52 24 64Z","M20 76Q45 78 79 69L75 74Q50 82 23 79Z","M50 16L66 18 51 22Z")+lines(1.4,"M11 86H25","M65 85H82")+flock(12,21,.5)
    ]

    art:[

      disk(47,33,12)+fills("M25 38H33L31 33H27ZM68 38H76L74 33H70Z","M10 64H90L87 68H13Z","M24 70H33V73H24ZM68 70H76V73H68Z")+lines(1.4,"M10 59Q22 53 29 36Q49 68 72 36Q82 53 90 58","M11 86H22","M72 82H89")+flock(72,22,.65)
    ]
  },{

    art:[
      cut("M18 73Q27 69 28 54Q29 29 47 27Q48 20 51 19Q55 20 55 27Q76 30 77 54Q78 69 84 73V77H18ZM35 55A7.5 7.5 0 1 0 50 55A7.5 7.5 0 1 0 35 55ZM55 51A6 6 0 1 0 67 51A6 6 0 1 0 55 51Z")+lines(2,"M52 22V11","M17 80H84")+waves(22,86,2,19)+disk(77,29,2.1)+disk(83,22,1.4),

"use strict";
const get = id => document.getElementById(id);
const directions = {up:[0,-1], right:[1,0], down:[0,1], left:[-1,0]};
const short = {u:"up",r:"right",d:"down",l:"left"};
const inkName = ["Teal","Coral"];
const N = 5;
let page, positions, starting, activeInk, undoStack, optimal, hintCount, solved, soundOn=false, audio;
const clean=[0,0,0,0];
let records={};
try { records = JSON.parse(localStorage.getItem("tideprint-sponsor-v1") || "{}") || {}; } catch {}
const bestMoves = i => Number.isInteger(records[i]) && records[i]>0 ? records[i] : null;
function shifted(state, ink, dir, rule) {
  const next=state.slice();
  const [dx,dy]=directions[dir], axis=dx?0:1, delta=dx||dy;
  const index=ink*2+axis, tow=rule.linked[index];
  next[index]=(next[index]+delta+N)%N;
  if(tow){const other=(1-ink)*2+Math.abs(tow)-1;next[other]=(next[other]+Math.sign(tow)*delta+N)%N;}
  return next;
}
function shortest(state, rule) {
  const queue=[{state,first:null,depth:0}], seen=new Set([state.join("")]);
  for(let j=0;j<queue.length;j++){
    const current=queue[j];
    if(current.state.every(v=>v===0)) return current;
    for(const ink of rule.fixed?[1]:[0,1]){
      for(const dir of Object.keys(directions)){
        const next=shifted(current.state,ink,dir,rule), key=next.join("");
        if(seen.has(key))continue;
        seen.add(key);queue.push({state:next,first:current.first||{ink,dir},depth:current.depth+1});
      }
    }
  }
  throw Error("Unreachable print");
}
function sound(kind) {
  if(!soundOn)return;
  try {
    audio ||= new AudioContext();
    audio.resume().catch(()=>{});
    const notes=kind==="finish"?[392,494,587]:kind==="switch"?[305]:[activeInk?220:165];
    notes.forEach((hz,i)=>{
      const t=audio.currentTime+i*.065,o=audio.createOscillator(),g=audio.createGain();
      o.type=kind==="finish"?"sine":"triangle";o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*.89,t+.075);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
      o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15);
    });
  } catch {}
}
function svgFrame(id, rule) {
  const mark=lines(.4,"M2 7H8M5 4V10M92 7H98M95 4V10M2 93H8M5 90V96M92 93H98M95 90V96");
  const grid=Array.from({length:N-1},(_,i)=>{const k=(i+1)*20;return lines(.28,"M"+k+" 0V100","M0 "+k+"H100");}).join("");
  const separation=(ink)=>'<g id="'+id+'-sep'+ink+'">'+rule.art[ink]+'</g>';
  const copies=(ink)=>[-100,0,100].flatMap(x=>[-100,0,100].map(y=>'<use href="#'+id+'-sep'+ink+'" x="'+x+'" y="'+y+'"/>')).join("");
  return '<svg viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>'+
    '<clipPath id="'+id+'-cut"><rect width="100" height="100"/></clipPath>'+separation(0)+separation(1)+
    '<pattern id="'+id+'-grain" patternUnits="userSpaceOnUse" width="3" height="4"><circle cx=".6" cy="1" r=".12" fill="#465953"/><circle cx="2.4" cy="3.2" r=".1" fill="#465953"/></pattern></defs>'+
    '<rect width="100" height="100" fill="#f5efdc"/><g transform="translate(7.5 10) scale(.85)"><rect width="100" height="100" fill="#f0e8d0" stroke="#9ca391" stroke-width=".4"/><g color="#b8b8a5" stroke-dasharray="1.1 1.3">'+grid+'</g>'+
    '<g clip-path="url(#'+id+'-cut)" style="isolation:isolate"><g data-layer="0" fill="#186878" color="#186878">'+copies(0)+'</g><g data-layer="1" fill="#e36647" color="#e36647" style="mix-blend-mode:multiply">'+copies(1)+'</g></g>'+
    '<rect width="100" height="100" fill="url(#'+id+'-grain)" opacity=".38"/></g><g color="#768279">'+mark+'</g></svg>';
}

const pad = [...document.querySelectorAll('[data-dir]')];
const inks = [get('blue'), get('red')];
const panel = document.querySelector('.tools');
const icon = name => '<svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-'+name+'"/></svg>';
let guide = null;
function announce(message) { get('voice').textContent = message; }
function loadPage(i) {
  page=i;
  const rule=editions[i];
  starting=rule.scramble.reduce((state,op)=>shifted(state,Number(op[0]),short[op[1]],rule),clean);
  positions=starting.slice(); optimal=shortest(positions,rule).depth;
  activeInk=rule.fixed?1:0; undoStack=[]; solved=false;
  guide=page===0?shortest(positions,rule).first:null;
  get('reference').innerHTML=svgFrame('ref',rule);
  get('reference').setAttribute('aria-label','Target image, '+rule.name);
  get('print').innerHTML=svgFrame('work',rule);
  get('advance').hidden=true;
  draw(); drawNav();
  announce('Print '+(i+1)+', '+rule.name+'. '+rule.rule+' Match the target image. Arrows shift the current plate, one and two choose the ink, H gives a hint.');
}
function drawNav() {
  get('levels').replaceChildren(...editions.map((ed,i)=>{
    const button=document.createElement('button');
    button.disabled=i>0&&!bestMoves(i-1);
    button.toggleAttribute('data-complete',!!bestMoves(i));
    button.setAttribute('aria-label','Print '+(i+1)+', '+ed.name+(button.disabled?', locked':bestMoves(i)?', completed':''));
    if(page===i)button.setAttribute('aria-current','step');
    button.onclick=()=>loadPage(i);
    return button;
  }));
}
function draw() {
  const work=get('print');
  work.parentElement.classList.toggle('registered',solved);
  work.querySelectorAll('[data-layer]').forEach((layer,ink)=>{
    layer.setAttribute('transform','translate('+positions[ink*2]*20+' '+positions[ink*2+1]*20+')');
  });
  work.setAttribute('aria-label',editions[page].name+'. '+(solved?'In register.':'Working print. Teal is '+positions[0]+' columns right and '+positions[1]+' rows down from target. Coral is '+positions[2]+' columns right and '+positions[3]+' rows down. Position wraps every five steps.'));
  panel.style.setProperty('--tone',activeInk?'var(--coral)':'var(--teal)');
  panel.classList.toggle('done',solved);
  panel.querySelector('.pad-hub').innerHTML=icon(activeInk?'coral':'teal');
  inks.forEach((button,i)=>{
    button.disabled=solved||(i===0&&editions[page].fixed);
    button.setAttribute('aria-pressed',String(i===activeInk));
    button.classList.toggle('guided',!!guide&&guide.ink!==activeInk&&guide.ink===i);
  });
  pad.forEach(button=>{
    button.disabled=solved;
    button.classList.toggle('guided',!!guide&&guide.ink===activeInk&&guide.dir===button.dataset.dir);
    button.classList.toggle('first-move',page===0&&!undoStack.length&&!bestMoves(0)&&!!guide&&guide.dir===button.dataset.dir);
  });
  get('undo').disabled=!undoStack.length||solved; get('hint').disabled=solved;
}
function choose(i) {
  if(solved||(i===0&&editions[page].fixed))return;
  activeInk=i;draw();sound('switch');announce(inkName[i]+' ink selected.');
}
function move(dir) {
  if(solved)return;
  const before=positions;
  undoStack.push({positions,ink:activeInk});
  positions=shifted(positions,activeInk,dir,editions[page]);solved=positions.every(v=>v===0);
  guide=!solved&&page===0?shortest(positions,editions[page]).first:null;
  if(solved){
    const moves=undoStack.length, best=bestMoves(page);
    if(!best||moves<best)records[page]=moves;
    try{localStorage.setItem('tideprint-sponsor-v1',JSON.stringify(records));}catch{}
    const last=page===editions.length-1;
    const advance=get('advance'); advance.innerHTML=icon(last?'check':'arrow');
    advance.setAttribute('aria-label',last?'View completed collection':'Next print');advance.hidden=false;
    drawNav();draw();advance.focus({preventScroll:true});sound('finish');
    announce('Print registered in '+moves+' moves. '+(last?'Open the collection.':'Next print unlocked.'));
  }else{
    draw();sound('press');announce(inkName[activeInk]+' shifted '+dir+'. '+undoStack.length+' moves.');
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    get('print').querySelectorAll('[data-layer]').forEach((layer,ink)=>{
      const ix=ink*2, x=positions[ix], y=positions[ix+1];
      const dx=(x-before[ix]+7)%5-2, dy=(y-before[ix+1]+7)%5-2;
      if(!dx&&!dy)return;
      layer.getAnimations().forEach(effect=>effect.cancel());
      layer.animate([{transform:'translate('+20*(x-dx)+'px,'+20*(y-dy)+'px)'},{transform:'translate('+20*x+'px,'+20*y+'px)'}],{duration:130,easing:'ease-out'});
    });
  }
}
function undo() {
  if(solved||!undoStack.length)return;
  const back=undoStack.pop();positions=back.positions;activeInk=back.ink;
  guide=page===0?shortest(positions,editions[page]).first:null;
  draw();announce('Last shift undone.');
}
function hint() {
  if(solved)return;
  guide=shortest(positions,editions[page]).first;draw();
  announce('Try '+inkName[guide.ink]+' '+guide.dir+'.');
}
pad.forEach(button=>{button.innerHTML=icon('arrow');button.onclick=()=>move(button.dataset.dir);});
inks.forEach((button,i)=>button.onclick=()=>choose(i));
get('undo').onclick=undo;get('hint').onclick=hint;get('reset').onclick=()=>loadPage(page);
get('sound').onclick=()=>{
  soundOn=!soundOn;get('sound').setAttribute('aria-pressed',String(soundOn));sound('switch');
};
get('advance').onclick=()=>{
  if(page<editions.length-1){loadPage(page+1);inks[activeInk].focus({preventScroll:true});return;}
  const gallery=get('gallery');
  gallery.replaceChildren(...editions.map((ed,i)=>{
    const button=document.createElement('button');
    button.innerHTML=svgFrame('gallery'+i,ed);
    button.setAttribute('aria-label','Replay '+ed.name);
    button.onclick=()=>{get('finished').close();loadPage(i);};
    return button;
  }));
  get('finished').showModal();get('close').focus({preventScroll:true});
};
get('close').onclick=()=>get('finished').close();
let contact=null;
// The press owns single-finger swipes. Suppress their compatibility click so
// Chromium delivers a tap on the controls immediately after a swipe.
get('print').addEventListener('touchstart',e=>{if(e.touches.length===1)e.preventDefault();},{passive:false});
get('print').addEventListener('pointerdown',e=>{
  if(solved||!e.isPrimary||e.button!==0)return;
  contact={x:e.clientX,y:e.clientY,id:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId);
});
get('print').addEventListener('pointerup',e=>{
  if(!contact||contact.id!==e.pointerId)return;
  const dx=e.clientX-contact.x,dy=e.clientY-contact.y;
  contact=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<Math.max(12,e.currentTarget.clientWidth*.075))return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});
get('print').addEventListener('pointercancel',()=>{contact=null;});
document.addEventListener('keydown',e=>{
  if(get('finished').open||e.ctrlKey||e.altKey||e.metaKey)return;
  const key=e.key.toLowerCase();
  if(key.startsWith('arrow')&&directions[key.slice(5)]){e.preventDefault();move(key.slice(5));}
  else if(key==='1'||key==='2'){e.preventDefault();choose(Number(key)-1);}
  else if(key==='z'){undo();}else if(key==='r'){loadPage(page);}else if(key==='h'){hint();}
});
loadPage(0);

</script>
